<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimal-ui"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Hoop Shooter</title>
    <link rel="stylesheet" href="styles/game.css" />
  </head>

  <body>
    <section id="game" class="row">
      <canvas id="debug-canvas" width="480" height="360"></canvas>
      <canvas id="canvas" width="480" height="360"></canvas>
    </section>
    <header>
      <div class="row">
        <h1>Hoop Shooter</h1>
      </div>
    </header>
    <section class="how-to-play row">
      <h2>How to Play?</h2>
      <p></p>
    </section>
    <footer>
      <div class="row">
        <p>
          This game is a modified example from the HTML5 Game Development
          Hotshot book by Makzan. Free for personal and commerical use.
        </p>
      </div>
    </footer>

    <!-- Having all the JavaScripts separated here for readability. Please merge them into one file in production. -->
    <script src="vendors/easeljs.min.js"></script>
    <script src="vendors/tweenjs.min.js"></script>
    <script src="vendors/preloadjs.min.js"></script>
    <script src="vendors/Box2d.min.js"></script>
    <script src="scripts/level.js"></script>
    <script src="scripts/physics.js"></script>
    <script src="scripts/view.js"></script>
    <script src="scripts/game.js"></script>
  </body>
</html>
