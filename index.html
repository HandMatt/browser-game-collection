<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Colour Quest</title>
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <!-- game title/header here -->
    <header>
      <div class="row">
        <h1>Colour Quest</h1>
      </div>
    </header>
    <!-- game content here -->
    <section id="game" class="row">
      <!-- scene elements here -->
      <div id="game-scene" class="scene out">
        <div id="timer"></div>
        <div id="stage">Stage 1</div>
        <div id="quest" class="quest">
          <div id="quest-composition" class="composition"></div>
        </div>
        <div id="your-composition"></div>
        <div id="deck" class="deck"></div>
        <a href="#" id="undo-button" class="button">Undo</a>
      </div>
      <div id="start-scene" class="scene">
        <a href="#" id="start-btn" class="button"> Start Game</a>
      </div>
      <div id="summary-scene" class="scene out">
        <a href="#" id="next-level-button" class="button">Next</a>
      </div>
      <div id="gameover-scene" class="scene out">
        <a href="#" id="back-to-menu-button" class="button">Back to menu</a>
      </div>
    </section>
    <!-- how to play here -->
    <section class="how-to-play row">
      <h2>How to Play?</h2>
      <p>
        Composite your deck with the patterns to look exactly the same as the
        one provided.
      </p>
    </section>
    <!-- footer/copyright info here -->
    <footer>
      <div class="row">
        <p>
          This game is a modified example from the HTML5 Game Development
          Hotshot book by Makzan. Free for personal and commerical use.
        </p>
      </div>
    </footer>
    <!-- individual display elements here -->
    <div id="element-template">
      <!-- for deck view -->
      <div class="pattern-slot">
        <div class="pattern" data-pattern="1"></div>
      </div>
      <!-- for composition view -->
      <div class="pattern" data-pattern="1"></div>
    </div>
    <!-- scripts loaded after the DOM elements -->
    <script src="js/patch.js"></script>
    <script src="js/composition.js"></script>
    <script src="js/composition-view.js"></script>
    <script src="js/quest.js"></script>
    <script src="js/scenes.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
